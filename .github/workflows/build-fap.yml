name: Build Flipper App

on:
  workflow_dispatch:
  push:
    paths:
      - 'flipper-app/**'
    tags:
      - '*'

env:
  # Flipper SDK channel to build against: release | rc | dev
  # This must match the API version of the firmware you run. A FAP built
  # against a different API shows "App Too Old / App Too New" on launch and
  # is listed with a generic "?" icon in the Apps menu.
  #   release -> 1.4.3 (API 87.1)
  #   dev     -> API 88.x
  SDK_CHANNEL: dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ufbt
        run: pip install ufbt

      - name: Select SDK channel
        run: ufbt update --channel=${{ env.SDK_CHANNEL }}

      - name: Build FAP
        run: cd flipper-app && ufbt build

      - name: Upload FAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude_buddy
          path: ~/.ufbt/build/claude_buddy.fap

      - name: Create release and attach FAP
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ~/.ufbt/build/claude_buddy.fap
